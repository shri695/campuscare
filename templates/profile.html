{% extends 'base.html' %}{% block content %}<h1>My profile</h1><p class="muted">Keep your contact and college details up to date.</p><form class="card formgrid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="full_name" value="{{ current_user.full_name }}" required></label><label>Email<input value="{{ current_user.email }}" disabled></label><label>College<input name="college" value="{{ profile.college }}"></label><label>Course<input name="course" value="{{ profile.course }}"></label><label>Semester<input type="number" min="1" max="12" name="semester" value="{{ profile.semester or '' }}"></label><label>Phone<input name="phone" value="{{ profile.phone }}"></label><label>Emergency contact<input name="emergency_contact" value="{{ profile.emergency_contact }}"></label><label class="wide">Address<textarea name="address">{{ profile.address }}</textarea></label><button class="primary">Save profile</button></form>{% endblock %}
